CONFIG_STDOUT_CONSOLE=y

#USB related configs
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Zephyr MSC sample"
CONFIG_USB_DEVICE_PID=0x0008
CONFIG_LOG=y
CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USB_MASS_STORAGE=y
CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
CONFIG_USB_MASS_STORAGE_LOG_LEVEL_ERR=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

CONFIG_APP_MSC_STORAGE_FLASH_FATFS=y

CONFIG_I2C=y
CONFIG_CMX655D=y
#CONFIG_CMX655D_INTERRUPT=y

#-------------------------------------------------------------- I2S
CONFIG_I2S=y

#-------------------------------------------------------------- Compiler and heap configurations
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=30720
CONFIG_NEWLIB_LIBC=y
#CONFIG_NEWLIB_LIBC_NANO=n
#CONFIG_HAS_NEWLIB_LIBC_NANO=n
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_CBPRINTF_FP_SUPPORT=y

#-------------------------------------------------------------- App config
CONFIG_LIB_AUDIO=y
CONFIG_LIB_AUDIO_CODEC_CMX655D=y
CONFIG_LIB_AUDIO_SAMPLE_RATE=8000
CONFIG_LIB_AUDIO_NUM_CHANNEL=2
CONFIG_LIB_AUDIO_BPS=16
CONFIG_LIB_AUDIO_MAX_REC_FILE_SIZE_KB=500