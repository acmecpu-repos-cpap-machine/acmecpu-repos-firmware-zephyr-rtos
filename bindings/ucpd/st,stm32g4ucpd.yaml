description: STM32G4 series USB C Power Delivery driver

include: "base.yaml"

compatible: "st,stm32g4ucpd"

properties:

    label:
        required: false
        type: string
        
    clock-frequency:
      type: int
      required: false
      description: |
        Clock frequency the SPI peripheral is being driven at, in Hz.
        
    "#address-cells":
      required: true
      const: 1
    "#size-cells":
      required: true
      const: 0
        
    reg:
      required: true
    
    interrupts:
      required: true

    io-channels:
      type: phandle-array
      required: true
      description: Analog channel for VBUS measurement
      
    io-channel-names:
      type: string-array
      required: true
      description: Analog channel name for VBUS measurement
      
    